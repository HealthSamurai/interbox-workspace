# ── Bun configuration ────────────────────────────────────────────────────────

[test]
# Confine `bun test` to this workspace's own tests.
#
# Left to itself, `bun test` walks the entire tree and would also collect the
# suites under utils/. Those packages are deliberately NOT part of the root
# install — each carries its own package.json and lockfile so a workspace user
# who never touches them doesn't pay for their dependencies on every
# `bun install` — so those tests can't resolve their imports from here and fail.
#
# Run each suite in its own directory instead:
#   cd utils/hl7v2-simulator && bun install && bun test
#   cd utils/ccda-sender && bun install && bun test
root = "test"
